<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务填写与管理 · 行政部驾驶舱</title>
<link rel="stylesheet" href="cockpit-style.css">
</head>
<body data-theme="dark">
<div class="wrap">
  <header class="top">
    <div>
      <h1>任务填写与管理</h1>
      <div class="sub">部门任务台账 · 数据来自 WorkBuddy「资料库」云表，录入请点右上角按钮</div>
    </div>
    <div class="meta">
      数据更新时间：<b id="updTime">—</b><br>
      <a href="./" style="color:inherit;text-decoration:underline">← 返回驾驶舱</a>
    </div>
  </header>

  <!-- 风格切换（与主页一致） -->
  <div class="toolbar">
    <span class="lab">界面风格：</span>
    <button class="tbtn" data-set="dark">深色科技大屏</button>
    <button class="tbtn" data-set="business">浅色商务</button>
    <button class="tbtn" data-set="glass">毛玻璃渐变</button>
    <button class="tbtn" data-set="gov">政务简约</button>
    <button class="tbtn" data-set="warm">暖橙现代</button>
  </div>
  <div class="note">↑ 点上方按钮随时更换皮肤；你的选择会被记住。</div>

  <div class="databar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="t">数据来源</span>
      <span class="hint">本看板为只读视图，数据来自 WorkBuddy「资料库」云表，由每小时自动任务同步刷新（录入后约 1 小时同步到本看板）。</span>
    </div>
    <a href="https://www.workbuddy.cn/space/d/E810IQGqpV9dHEwsnuIsb7" target="_blank" rel="noopener" class="lib-btn">去资料库录入 / 修改任务</a>
  </div>

  <!-- KPI -->
  <div class="kpis" id="kpis" style="grid-template-columns:repeat(6,1fr)"></div>

  <!-- 筛选 -->
  <div class="sec-title">部门任务台账</div>
  <div class="sec-sub">以下为当前任务（状态、进度、临期·逾期自动标识）。</div>
  <div class="filters" id="filters">
    <button class="fbtn active" data-f="all">全部</button>
    <button class="fbtn" data-f="进行中">进行中</button>
    <button class="fbtn" data-f="已完成">已完成</button>
    <button class="fbtn" data-f="未开始">未开始</button>
    <button class="fbtn" data-f="已暂停">已暂停</button>
    <button class="fbtn" data-f="逾期">逾期</button>
    <span style="flex:1"></span>
    <select id="catFilter" style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--text);font-size:13px">
      <option value="">全部分类</option>
    </select>
  </div>

  <!-- 任务列表 -->
  <div class="card">
    <div id="taskBoard"></div>
  </div>

  <footer>行政部驾驶舱 · 任务填写与管理（资料库只读看板）· 与主页共用同一套风格与皮肤</footer>
</div>

<style>
.lib-btn{display:inline-block;border:1px solid var(--primary);background:var(--primary);color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none}
.lib-btn:hover{opacity:.92}
.kpis{grid-template-columns:repeat(6,1fr)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--text-2);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.fbtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 任务卡片 */
.tkcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tkcard{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--radius);padding:14px 16px;background:var(--bg)}
.tkcard.over{opacity:.6}
.tk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tk-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.35}
.tk-cat{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:#fff;background:var(--primary);padding:2px 9px;border-radius:20px}
.tk-meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2)}
.tk-meta b{color:var(--text);font-weight:600}
.tk-bar{margin-top:10px;height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.tk-bar > i{display:block;height:100%;background:var(--primary)}
.tk-prog{margin-top:5px;font-size:12px;color:var(--text-2)}
.tk-block{margin-top:8px;font-size:12.5px;color:var(--alert);background:rgba(194,39,45,.08);padding:6px 9px;border-radius:6px}
.tk-due{font-weight:600}
.tk-due.soon{color:var(--warn)}
.tk-due.late{color:var(--alert)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)!important}.tkcards{grid-template-columns:1fr}}
</style>

<script>
/* ============ 风格切换（与主页共用 localStorage 键） ============ */
function applyTheme(t){
  document.body.dataset.theme=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.set===t));
  try{ localStorage.setItem('xz-cockpit-theme',t); }catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.set));
let saved=null; try{ saved=localStorage.getItem('xz-cockpit-theme'); }catch(e){}
if(saved && ['dark','business','glass','gov','warm'].includes(saved)) applyTheme(saved); else applyTheme('dark');

/* ============ 工具（与主页一致） ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toDate(s){ if(!s) return null; const m=String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function isOverdue(r){ if(r.status==='已逾期') return true; if(r.status==='已完成') return false; const d=toDate(r.deadline); const t=toDate(todayStr()); return !!(d&&t&&d<t); }
function weekEnd(){
  const t=toDate(todayStr()); if(!t) return null;
  const day=(t.getDay()+6)%7;
  const we=new Date(t); we.setDate(t.getDate()+(6-day)); return we;
}

/* ============ 示例数据（无真实数据时演示，与主页一致） ============ */
const SAMPLE_TASKS=[
  {name:'年度工作会议统筹',category:'会务接待',note:'主会场布置与议程',owner:'王伟',collab:'李娜,张敏',status:'已完成',progress:100,start:'2026-07-10',deadline:'2026-07-20',priority:'高',blocker:'',update:'2026-07-21'},
  {name:'三季度车辆年检',category:'车辆管理',note:'12台公务车年审排期',owner:'李娜',collab:'',status:'进行中',progress:60,start:'2026-08-01',deadline:'2026-08-25',priority:'中',blocker:'部分车辆预约紧张',update:'2026-08-14'},
  {name:'食堂供应商比选',category:'后勤管理',note:'三家比价与合同',owner:'张敏',collab:'周婷',status:'进行中',progress:45,start:'2026-08-05',deadline:'2026-08-30',priority:'高',blocker:'',update:'2026-08-14'},
  {name:'办公耗材采购',category:'物资采购',note:'三季度耗材清单',owner:'刘洋',collab:'',status:'已完成',progress:100,start:'2026-07-15',deadline:'2026-08-01',priority:'中',blocker:'',update:'2026-08-02'},
  {name:'印章使用台账梳理',category:'行政办公',note:'用印记录电子化',owner:'陈静',collab:'',status:'已暂停',progress:30,start:'2026-07-20',deadline:'2026-08-18',priority:'低',blocker:'等法务确认模板',update:'2026-08-10'},
  {name:'新员工入职手续',category:'人力资源',note:'3名新员工报到',owner:'杨帆',collab:'胡斌',status:'进行中',progress:70,start:'2026-08-08',deadline:'2026-08-20',priority:'高',blocker:'',update:'2026-08-14'},
  {name:'上级检查接待',category:'会务接待',note:'迎检路线与材料',owner:'赵磊',collab:'王伟',status:'进行中',progress:40,start:'2026-08-12',deadline:'2026-08-22',priority:'高',blocker:'',update:'2026-08-14'},
  {name:'车辆维修台账',category:'车辆管理',note:'维修记录归集',owner:'李娜',collab:'',status:'未开始',progress:0,start:'2026-08-15',deadline:'2026-09-05',priority:'低',blocker:'',update:'2026-08-15'},
  {name:'宿舍修缮',category:'后勤管理',note:'3号楼漏水处理',owner:'周婷',collab:'',status:'逾期',progress:55,start:'2026-07-25',deadline:'2026-08-10',priority:'中',blocker:'施工队排期冲突',update:'2026-08-13'},
  {name:'节庆慰问品采购',category:'物资采购',note:'中秋慰问',owner:'刘洋',collab:'张敏',status:'进行中',progress:35,start:'2026-08-10',deadline:'2026-09-15',priority:'中',blocker:'',update:'2026-08-14'},
  {name:'公文流转优化',category:'行政办公',note:'收发文流程简化',owner:'陈静',collab:'',status:'进行中',progress:50,start:'2026-08-03',deadline:'2026-08-28',priority:'中',blocker:'',update:'2026-08-14'},
  {name:'季度培训计划',category:'人力资源',note:'Q3培训排期',owner:'杨帆',collab:'',status:'未开始',progress:0,start:'2026-08-18',deadline:'2026-09-10',priority:'低',blocker:'',update:'2026-08-15'},
  {name:'外事接待预案',category:'会务接待',note:'涉外活动准备',owner:'赵磊',collab:'王伟',status:'已暂停',progress:20,start:'2026-07-30',deadline:'2026-08-12',priority:'高',blocker:'等外事口径',update:'2026-08-11'},
  {name:'油料管理规范',category:'车辆管理',note:'用油台账与限额',owner:'李娜',collab:'',status:'已完成',progress:100,start:'2026-07-01',deadline:'2026-07-31',priority:'中',blocker:'',update:'2026-08-01'},
  {name:'绿植养护外包',category:'后勤管理',note:'办公区绿化',owner:'周婷',collab:'',status:'进行中',progress:65,start:'2026-08-06',deadline:'2026-08-26',priority:'低',blocker:'',update:'2026-08-14'},
  {name:'档案数字化',category:'行政办公',note:'历史档案扫描',owner:'陈静',collab:'胡斌',status:'进行中',progress:25,start:'2026-08-09',deadline:'2026-09-20',priority:'中',blocker:'',update:'2026-08-14'},
  {name:'绩效考核填报',category:'人力资源',note:'半年考核',owner:'杨帆',collab:'',status:'未开始',progress:0,start:'2026-08-20',deadline:'2026-09-30',priority:'高',blocker:'',update:'2026-08-15'},
  {name:'应急物资储备',category:'物资采购',note:'防汛物资',owner:'刘洋',collab:'',status:'进行中',progress:80,start:'2026-08-02',deadline:'2026-08-22',priority:'高',blocker:'',update:'2026-08-14'}
];

/* ============ 数据加载（优先内嵌，回退示例） ============ */
let TASK_DATA=[], DEMO=false, curFilter='all', curCat='';
async function loadData(){
  if(window.__COCKPIT_DATA__ && window.__COCKPIT_DATA__.tasks && window.__COCKPIT_DATA__.tasks.length){
    TASK_DATA=window.__COCKPIT_DATA__.tasks;
    document.getElementById('updTime').textContent='数据内嵌（每小时自动更新）';
    prep(); render(); return;
  }
  DEMO=true; TASK_DATA=SAMPLE_TASKS.map(t=>({...t}));
  document.getElementById('updTime').textContent='示例数据';
  prep(); render();
}
function prep(){
  TASK_DATA.forEach(r=>{ if(isOverdue(r) && r.status!=='已逾期') r.status='已逾期'; });
  const sel=document.getElementById('catFilter');
  const cats=[...new Set(TASK_DATA.map(r=>r.category))];
  sel.innerHTML='<option value="">全部分类</option>'+cats.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
}

/* ============ 渲染 ============ */
function render(){
  const today=todayStr(), we=weekEnd();
  const total=TASK_DATA.length;
  const doing=TASK_DATA.filter(r=>r.status==='进行中').length;
  const done=TASK_DATA.filter(r=>r.status==='已完成').length;
  const overdue=TASK_DATA.filter(r=>r.status==='已逾期').length;
  const high=TASK_DATA.filter(r=>r.priority==='高'&&r.status!=='已完成').length;
  const dueWeek=TASK_DATA.filter(r=>{ const d=toDate(r.deadline); return d&&we&&d>=toDate(today)&&d<=we&&r.status!=='已完成'; }).length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="strip"></div><div class="label">任务总数</div><div class="num">${total}</div></div>
    <div class="kpi warn"><div class="strip"></div><div class="label">进行中</div><div class="num">${doing}</div></div>
    <div class="kpi green"><div class="strip"></div><div class="label">已完成</div><div class="num">${done}</div></div>
    <div class="kpi red"><div class="strip"></div><div class="label">逾期</div><div class="num">${overdue}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">高优先级</div><div class="num">${high}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">本周截止</div><div class="num">${dueWeek}</div></div>`;

  let list=TASK_DATA.map((r,i)=>({r,i}));
  if(curFilter==='逾期') list=list.filter(x=>x.r.status==='已逾期');
  else if(curFilter!=='all') list=list.filter(x=>x.r.status===curFilter);
  if(curCat) list=list.filter(x=>x.r.category===curCat);

  const wrap=document.getElementById('taskBoard');
  if(DEMO && !list.length){ wrap.innerHTML='<div class="empty">以下为<b>示例预览</b>。在资料库录入真实任务后，本看板每小时自动同步更新。</div>'; }
  else if(!list.length){ wrap.innerHTML='<div class="empty">没有符合条件的任务。</div>'; }
  else {
    wrap.innerHTML='<div class="tkcards">'+list.map(({r,i})=>{
      const d=toDate(r.deadline), t=toDate(today);
      let dueCls='', dueTxt=r.deadline||'—';
      if(d&&t){ const days=(d-t)/86400000; if(days<0){dueCls='late';dueTxt=r.deadline+'（已逾期）';} else if(days<=7){dueCls='soon';dueTxt=r.deadline+'（临期'+Math.ceil(days)+'天）';} }
      const prog=Math.max(0,Math.min(100,parseInt(r.progress)||0));
      const block=r.blocker?('<div class="tk-block">堵点：'+esc(r.blocker)+'</div>'):'';
      return `<div class="tkcard ${r.status==='已完成'?'over':''}">
        <div class="tk-top">
          <div><div class="tk-name">${esc(r.name)}</div><span class="tk-cat">${esc(r.category)}</span></div>
          <span class="tag s-${r.status}">${r.status}</span>
        </div>
        <div class="tk-meta">
          <span>负责人：<b>${esc(r.owner||'—')}</b></span>
          <span>协同：<b>${esc(r.collab||'—')}</b></span>
          <span>优先级：<b>${esc(r.priority||'—')}</b></span>
          <span class="tk-due ${dueCls}">截止：<b>${dueTxt}</b></span>
        </div>
        <div class="tk-bar"><i style="width:${prog}%"></i></div>
        <div class="tk-prog">进度 ${prog}%</div>
        ${r.note?('<div class="tk-meta" style="margin-top:6px">备注：'+esc(r.note)+'</div>'):''}
        ${block}
      </div>`;
    }).join('')+'</div>';
  }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ============ 筛选交互 ============ */
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); curFilter=b.dataset.f; render();
});
document.getElementById('catFilter').onchange=(e)=>{ curCat=e.target.value; render(); };

loadData();
</script>
</body>
</html>
