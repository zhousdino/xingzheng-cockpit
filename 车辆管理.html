<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆管理 · 行政部驾驶舱</title>
<link rel="stylesheet" href="cockpit-style.css">
</head>
<body data-theme="dark">
<div class="wrap">
  <header class="top">
    <div>
      <h1>车辆管理</h1>
      <div class="sub">部门车辆台账 · 数据来自 WorkBuddy「资料库」云表，录入请点右上角按钮</div>
    </div>
    <div class="meta">
      数据更新时间：<b id="updTime">—</b><br>
      <a href="https://26e39b5a0aed44d7b0bfbb45dd2fd2c6.app.workbuddy.link" style="color:inherit;text-decoration:underline">← 返回驾驶舱</a>
    </div>
  </header>

  <!-- 风格切换（与主页一致） -->
  <div class="toolbar">
    <span class="lab">界面风格：</span>
    <button class="tbtn" data-set="dark">深色科技大屏</button>
    <button class="tbtn" data-set="business">浅色商务</button>
    <button class="tbtn" data-set="glass">毛玻璃渐变</button>
    <button class="tbtn" data-set="gov">政务简约</button>
    <button class="tbtn" data-set="warm">暖橙现代</button>
  </div>
  <div class="note">↑ 点上方按钮随时更换皮肤；你的选择会被记住。</div>

  <div class="databar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="t">数据来源</span>
      <span class="hint">本看板为只读视图，数据来自 WorkBuddy「资料库」云表，由每小时自动任务同步刷新（录入后约 1 小时同步到本看板）。</span>
    </div>
    <a href="https://www.workbuddy.cn/space/d/ckVeiMCyKQ9qzTrK159dKk" target="_blank" rel="noopener" class="lib-btn">去资料库录入 / 修改车辆</a>
  </div>

  <!-- 批量导入：模板下载 + 文件导入（本地校验/预览） -->
  <div class="impbar">
    <button id="btnTpl" class="imp-btn primary">⬇ 下载导入模板</button>
    <button id="btnImp" class="imp-btn">⬆ 导入数据文件（CSV）</button>
    <input type="file" id="fileInp" accept=".csv,text/csv" style="display:none">
    <span class="imp-hint">先下载模板 → 按列填好 → 导入做校验预览。导入仅本地预览，真正写入资料库请把核对文件发管理员。</span>
  </div>
  <div id="impResult" class="imp-result" style="display:none"></div>

  <!-- KPI -->
  <div class="kpis" id="kpis" style="grid-template-columns:repeat(6,1fr)"></div>

  <!-- 车辆列表 -->
  <div class="sec-title">车辆台账</div>
  <div class="sec-sub">以下为当前车辆信息（含保险 / 通行证临期·过期自动标红）。</div>
  <div class="card">
    <div id="vehBoard"></div>
  </div>

  <footer>行政部驾驶舱 · 车辆管理（资料库只读看板）· 与主页共用同一套风格与皮肤</footer>
</div>

<style>
.lib-btn{display:inline-block;border:1px solid var(--primary);background:var(--primary);color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none}
.lib-btn:hover{opacity:.92}
.kpis{grid-template-columns:repeat(6,1fr)}
@keyframes warnflash{0%,100%{opacity:1}50%{opacity:.55}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)!important}}

/* ============ 批量导入（模板下载 + 本地校验预览） ============ */
.impbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px;padding:12px 14px;background:var(--panel,#16213a);border:1px solid var(--line,#2a3a5e);border-radius:12px}
.imp-btn{cursor:pointer;border:1px solid var(--accent,#3a8dff);background:transparent;color:var(--accent,#3a8dff);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap}
.imp-btn:hover{background:rgba(58,141,255,.12)}
.imp-btn.primary{background:var(--accent,#3a8dff);color:#fff}
.imp-btn.primary:hover{opacity:.92}
.imp-hint{font-size:12px;color:var(--text-2,#9fb0d0);line-height:1.5;flex:1;min-width:240px}
.imp-result{margin:10px 0 4px;padding:14px;border:1px solid var(--line,#2a3a5e);border-radius:12px;background:var(--panel,#16213a)}

.imp-result .ok{background:rgba(52,208,160,.15);color:#34d0a0}
.imp-result .warn{background:rgba(255,195,77,.15);color:#ffc34d}
.imp-result .err{background:rgba(255,122,89,.15);color:#ff7a59}
.imp-result .scroll{max-height:380px;overflow:auto;border:1px solid var(--line,#2a3a5e);border-radius:8px}
.imp-result table{width:100%;border-collapse:collapse;font-size:13px}
.imp-result th,.imp-result td{padding:7px 9px;border-bottom:1px solid var(--line,#2a3a5e);text-align:left;white-space:nowrap}
.imp-result th{color:var(--text-2,#9fb0d0);font-weight:600;position:sticky;top:0;background:var(--panel,#16213a);z-index:1}
.imp-result tr.err td{background:rgba(255,122,89,.08)}
.imp-result tr.warn td{background:rgba(255,195,77,.07)}

.imp-result td.iss.w{color:#ffc34d}
.imp-tip{font-size:12px;color:var(--text-2,#9fb0d0);line-height:1.7;margin:10px 0 0;border-left:3px solid var(--accent,#3a8dff);padding-left:10px}
.imp-tip b{color:var(--text,#e8eefc)}
</style>

<script>
/* ============ 风格切换（与主页共用 localStorage 键） ============ */
function applyTheme(t){
  document.body.dataset.theme=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.set===t));
  try{ localStorage.setItem('xz-cockpit-theme',t); }catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.set));
let saved=null; try{ saved=localStorage.getItem('xz-cockpit-theme'); }catch(e){}
if(saved && ['dark','business','glass','gov','warm'].includes(saved)) applyTheme(saved); else applyTheme('dark');

/* ============ 工具（与主页一致） ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toDate(s){ if(!s) return null; const m=String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function vehExpClass(date){ if(!date) return ''; const today=todayStr(); if(date<today) return 'exp'; const d=toDate(date),t=toDate(today); if(d&&t){ const days=(d-t)/86400000; if(days>=0&&days<=30) return 'warn'; } return ''; }
function vehStatusClass(s){ return s==='停用'?'stop':(s==='保养'?'maint':(s==='维修'?'repair':'normal')); }

/* ============ 示例数据（无真实数据时演示） ============ */
const SAMPLE_VEHICLES=[
  {plate:'新A·12345', model:'别克 GL8', vehClass:'公务轿车', fuel:'汽油', vin:'LGWEF5A5XKH000123', ownership:'自购', unit:'综合办公室', leaseStart:'', leaseExp:'', insurance:'人保 PICC-8821', insExp:'2026-09-30', inspExp:'2026-11-10', permit:'通-034', permitExp:'2026-12-31', status:'正常', driver:'李娜', curLoc:'', locTime:'', mileage:'42000', maintDate:'2026-10-01', note:'主要用于接待'},
  {plate:'新B·67890', model:'江铃全顺', vehClass:'中巴客车', fuel:'柴油', vin:'LVZCB2BB5JW000456', ownership:'租赁', unit:'后勤保障组', leaseStart:'2025-09-01', leaseExp:'2026-12-31', insurance:'平安 PA-5543', insExp:'2026-08-10', inspExp:'2026-08-25', permit:'通-017', permitExp:'2026-10-15', status:'保养', driver:'王强', curLoc:'', locTime:'', mileage:'86000', maintDate:'2026-08-20', note:'下周年检'},
  {plate:'新C·11223', model:'丰田陆地巡洋舰', vehClass:'SUV越野', fuel:'汽油', vin:'JTEBX9FJ0K000789', ownership:'自购', unit:'工程组', leaseStart:'', leaseExp:'', insurance:'人寿财 LR-9012', insExp:'2027-03-20', inspExp:'2026-09-05', permit:'通-052', permitExp:'2026-07-31', status:'维修', driver:'赵磊', curLoc:'', locTime:'', mileage:'120000', maintDate:'2026-08-18', note:'空调检修中'}
];

/* ============ 数据加载（优先内嵌，回退示例） ============ */
let VEHICLE_DATA=[], VEHICLE_SCHED=[], DEMO=false;
async function loadData(){
  if(window.__COCKPIT_DATA__ && window.__COCKPIT_DATA__.vehicles && window.__COCKPIT_DATA__.vehicles.length){
    VEHICLE_DATA=window.__COCKPIT_DATA__.vehicles;
    VEHICLE_SCHED=window.__COCKPIT_DATA__.vehiclesched||[];
    document.getElementById('updTime').textContent='数据内嵌（每小时自动更新）';
    render(); return;
  }
  // 回退示例
  DEMO=true; VEHICLE_DATA=SAMPLE_VEHICLES; VEHICLE_SCHED=[];
  document.getElementById('updTime').textContent='示例数据';
  render();
}

/* ============ 渲染 ============ */
function vehCards(list,sched,today){
  return '<div class="vcards">'+list.map((v,i)=>{
    const sc=vehStatusClass(v.status);
    const insCls=vehExpClass(v.insExp), permCls=vehExpClass(v.permitExp),
          inspCls=vehExpClass(v.inspExp), leaseCls=vehExpClass(v.leaseExp),
          maintCls=vehExpClass(v.maintDate);
    const flag=d=> d?(d<today?'（已过期）':(vehExpClass(d)==='warn'?'（临期≤30天）':'')):'';
    return `<div class="vcard">
      <div class="vhead"><span class="vplate">${v.plate}</span>
        <span class="vstatus ${sc}">${v.status}</span>
        <span class="vown">${v.ownership||'—'}</span>
        ${v.vehClass?('<span class="vown">'+v.vehClass+'</span>'):''}</div>
      <div class="vinfo">
        <div class="it"><span class="k">车型</span><span class="vv">${v.model||'—'}</span></div>
        <div class="it"><span class="k">燃料</span><span class="vv">${v.fuel||'—'}</span></div>
        <div class="it"><span class="k">车架号</span><span class="vv">${v.vin||'—'}</span></div>
        <div class="it"><span class="k">使用单位</span><span class="vv">${v.unit||'—'}</span></div>
        <div class="it"><span class="k">驾驶员</span><span class="vv">${v.driver||'—'}</span></div>
        <div class="it"><span class="k">当前里程</span><span class="vv">${(v.mileage!==''&&v.mileage!=null)?(v.mileage+' km'):'—'}</span></div>
        <div class="it"><span class="k">保险</span><span class="vv ${insCls}">${v.insurance||'—'}${v.insExp?(v.insExp+flag(v.insExp)):''}</span></div>
        <div class="it"><span class="k">年检</span><span class="vv ${inspCls}">${v.inspExp?(v.inspExp+flag(v.inspExp)):'—'}</span></div>
        <div class="it"><span class="k">通行证</span><span class="vv ${permCls}">${v.permit||'—'}${v.permitExp?(v.permitExp+flag(v.permitExp)):''}</span></div>
        <div class="it"><span class="k">租赁</span><span class="vv ${leaseCls}">${v.leaseExp?(v.leaseStart?(v.leaseStart+' ~ '):'')+v.leaseExp+flag(v.leaseExp):'—'}</span></div>
        <div class="it"><span class="k">下次保养</span><span class="vv ${maintCls}">${v.maintDate?(v.maintDate+flag(v.maintDate)):'—'}</span></div>
        <div class="it" style="grid-column:1/3"><span class="k">备注</span><span class="vv">${v.note||'—'}</span></div>
      </div>
    </div>`;
  }).join('')+'</div>';
}
function render(){
  const today=todayStr();
  const vk=document.getElementById('kpis');
  const total=VEHICLE_DATA.length;
  const normal=VEHICLE_DATA.filter(r=>r.status==='正常').length;
  const maint=VEHICLE_DATA.filter(r=>r.status==='保养').length;
  const repair=VEHICLE_DATA.filter(r=>r.status==='维修').length;
  const stop=VEHICLE_DATA.filter(r=>r.status==='停用').length;
  const ownBuy=VEHICLE_DATA.filter(r=>r.ownership==='自购').length;
  const ownRent=VEHICLE_DATA.filter(r=>r.ownership==='租赁').length;
  const expiring=VEHICLE_DATA.filter(r=>{
    const ds=[r.insExp,r.inspExp,r.permitExp,r.leaseExp,r.maintDate].filter(Boolean);
    return ds.some(d=>{ const c=vehExpClass(d); return c==='exp'||c==='warn'; });
  }).length;
  vk.innerHTML=`
    <div class="kpi"><div class="strip"></div><div class="label">车辆总数</div><div class="num">${total}</div></div>
    <div class="kpi green"><div class="strip"></div><div class="label">正常</div><div class="num">${normal}</div></div>
    <div class="kpi warn"><div class="strip"></div><div class="label">保养</div><div class="num">${maint}</div></div>
    <div class="kpi red"><div class="strip"></div><div class="label">维修</div><div class="num">${repair}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">停用</div><div class="num">${stop}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">自购</div><div class="num">${ownBuy}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">租赁</div><div class="num">${ownRent}</div></div>
    <div class="kpi red"><div class="strip"></div><div class="label">临期/过期</div><div class="num">${expiring}</div></div>`;
  const wrap=document.getElementById('vehBoard');
  if(DEMO){ wrap.innerHTML='<div class="empty">以下为<b>示例预览</b>。在资料库录入真实车辆后，本看板每小时自动同步更新。</div>'+vehCards(VEHICLE_DATA,[],today); }
  else if(!total){ wrap.innerHTML='<div class="empty">暂无车辆信息。</div>'; }
  else { wrap.innerHTML=vehCards(VEHICLE_DATA,[],today); }
}

/* ============ 批量导入模块（模板下载 + 本地校验预览） ============ */
/* 字段与资料库「行政部-车辆信息」一致；下拉项取自表结构，避免导入时选项不匹配。 */
const IMP_SCHEMA = {
  label: '车辆',
  required: ['车牌'],
  headers: ['车牌','车型','车辆类别','燃料类型','车架号','所有情况','使用单位','租赁起始日','租赁到期日','保险','保险到期','年检到期','通行证','通行证到期','状态','驾驶员','当前位置','上报时间','当前里程','下次保养日期','备注'],
  dateCols: ['租赁起始日','租赁到期日','保险到期','年检到期','通行证到期','上报时间','下次保养日期'],
  numCols: ['当前里程'],
  selects: {
    '车辆类别': ['公务轿车','SUV越野','皮卡','中巴客车','货车'],
    '燃料类型': ['汽油','柴油','新能源'],
    '所有情况': ['自购','租赁'],
    '状态': ['正常','保养','维修','停用']
  }
};

function impNormDate(s){
  s=String(s==null?'':s).trim(); if(!s) return {v:'',ok:true};
  let t=s.replace(/[年月]/g,'-').replace(/[日]/g,'').replace(/[./／．]/g,'-').replace(/\s+/g,'');
  const p=t.split('-').map(x=>x.replace(/\D/g,'')).filter(x=>x!=='');
  if(p.length>=3 && p[0]){ let y=p[0]; if(y.length===2) y='20'+y; return {v:y+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0'), ok:true}; }
  return {v:s, ok:false};
}
function impDecode(buf){
  let txt=new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(buf));
  if(/�/.test(txt)){ try{ const g=new TextDecoder('gbk',{fatal:false}).decode(new Uint8Array(buf)); if(g && !/�/.test(g)) txt=g; }catch(e){} }
  return txt;
}
function impParseCSV(text, delim){
  if(!delim) delim=(text.indexOf('\t')>=0)?'\t':',';
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else if(c==='\n'){ f+=' '; } else if(c!=='\r'){ f+=c; } }
    else { if(c==='"') q=true; else if(c===delim){ row.push(f); f=''; } else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else if(c!=='\r'){ f+=c; } }
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function impCell(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; }
function impEsc(s){ s=String(s==null?'':s); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function impDownload(name, content){
  const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function impStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes()); }
function impShowError(msg){ const box=document.getElementById('impResult'); box.style.display='block'; box.innerHTML='<div class="imp-tip" style="border-color:var(--warn,#ff7a59);color:#ff9b80">'+impEsc(msg)+'</div>'; }
function impValidate(obj){
  const errors=[], warns=[];
  IMP_SCHEMA.required.forEach(h=>{ if(!String(obj[h]||'').trim()) errors.push('缺必填「'+h+'」'); });
  IMP_SCHEMA.dateCols.forEach(h=>{ const v=String(obj[h]||'').trim(); if(v){ const r=impNormDate(v); if(!r.ok) errors.push('「'+h+'」日期无效('+v+')'); else obj[h]=r.v; } });
  IMP_SCHEMA.numCols.forEach(h=>{ const v=String(obj[h]||'').trim(); if(v){ const n=parseFloat(v.replace(/[,，]/g,'')); if(isNaN(n)) errors.push('「'+h+'」数字无效('+v+')'); else obj[h]=String(n); } });
  Object.keys(IMP_SCHEMA.selects).forEach(h=>{ const v=String(obj[h]||'').trim(); if(v){ const opts=IMP_SCHEMA.selects[h]; if(!opts.includes(v)) warns.push('「'+h+'」应为：'+opts.join('/')); } });
  return {errors,warns};
}
function impProcess(buf){
  const text=impDecode(buf);
  const rawRows=impParseCSV(text);
  let hi=-1; for(let i=0;i<rawRows.length;i++){ if(rawRows[i].some(c=>String(c).trim()!=='')){ hi=i; break; } }
  if(hi<0){ impShowError('文件为空或无法识别，请检查后重试。'); return; }
  const fileHeaders=rawRows[hi].map(h=>String(h).trim());
  const idx={}; const missing=[];
  IMP_SCHEMA.headers.forEach(h=>{ const k=fileHeaders.indexOf(h); if(k>=0) idx[h]=k; else missing.push(h); });
  const missReq=IMP_SCHEMA.required.filter(h=>!(h in idx));
  if(missReq.length){ impShowError('文件缺少必填列：'+missReq.join('、')+'。请先用上方「下载导入模板」按模板列填写后再导入。'); return; }
  const data=[];
  for(let r=hi+1;r<rawRows.length;r++){
    const cells=rawRows[r];
    if(cells.every(c=>String(c).trim()==='')) continue;
    const obj={}; IMP_SCHEMA.headers.forEach(h=>{ obj[h]=(h in idx)?String(cells[idx[h]]||'').trim():''; });
    data.push(obj);
  }
  if(!data.length){ impShowError('文件中没有可导入的数据行（除表头外均为空）。'); return; }
  let okCount=0, warnCount=0, errCount=0;
  const rowsHtml=data.map((obj,ri)=>{
    const {errors,warns}=impValidate(obj);
    const cls=errors.length?'err':(warns.length?'warn':'');
    if(errors.length) errCount++; else if(warns.length) warnCount++; else okCount++;
    const idv=obj[IMP_SCHEMA.required[0]]||('第'+(ri+1)+'行');
    const issTxt=errors.concat(warns).join('；');
    const badge=errors.length?'<span class="imp-badge err">✗ 错误</span>':(warns.length?'<span class="imp-badge warn">⚠ 注意</span>':'<span class="imp-badge ok">✓ 通过</span>');
    const cells=IMP_SCHEMA.headers.map(h=>'<td>'+impEsc(obj[h])+'</td>').join('');
    return '<tr class="'+cls+'"><td>'+impEsc(idv)+'</td>'+cells+'<td>'+badge+'</td><td class="iss'+(errors.length?'':' w')+'">'+impEsc(issTxt)+'</td></tr>';
  }).join('');
  const headHtml='<th>'+IMP_SCHEMA.label+'标识</th>'+IMP_SCHEMA.headers.map(h=>'<th>'+h+'</th>').join('')+'<th>校验</th><th>问题</th>';
  const html='<div class="imp-sum">'+
    '<span>共 <b>'+data.length+'</b> 行</span>'+
    '<span class="imp-badge ok">✓ 通过 '+okCount+'</span>'+
    '<span class="imp-badge warn">⚠ 注意 '+warnCount+'</span>'+
    '<span class="imp-badge err">✗ 错误 '+errCount+'</span>'+
    '<button id="btnExp" class="imp-btn primary" style="margin-left:auto">⬇ 导出核对文件（CSV）</button>'+
    '</div>'+
    '<div class="scroll"><table><thead><tr>'+headHtml+'</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="imp-tip">导入仅做<b>本地预览与校验</b>，不会直接写入资料库。请点「导出核对文件」把校验后的数据保存下来，发给管理员，由其在后台执行真实写入（静态页面出于安全无法直连资料库）。<br>标红「错误」：请回到 CSV 修改对应单元格后重新导入；标黄「注意」：多为下拉项拼写，管理员会按现有选项归一。</div>';
  const box=document.getElementById('impResult'); box.style.display='block'; box.innerHTML=html;
  document.getElementById('btnExp').onclick=()=>{
    let csv=IMP_SCHEMA.headers.map(impCell).join(',')+'\n';
    data.forEach(o=>{ csv+=IMP_SCHEMA.headers.map(h=>impCell(o[h])).join(',')+'\n'; });
    impDownload(IMP_SCHEMA.label+'核对文件_'+impStamp()+'.csv', csv);
  };
}

/* 模板下载：生成与资料库字段完全一致的 CSV（含 BOM，Excel 中文不乱码），附 3 行空白供填写 */
document.getElementById('btnTpl').onclick=()=>{
  let csv=IMP_SCHEMA.headers.map(impCell).join(',')+'\n';
  for(let i=0;i<3;i++) csv+='\n';
  impDownload(IMP_SCHEMA.label+'导入模板.csv', csv);
};
/* 文件导入 */
document.getElementById('btnImp').onclick=()=>document.getElementById('fileInp').click();
document.getElementById('fileInp').onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=()=>impProcess(r.result); r.readAsArrayBuffer(file); e.target.value='';
};

loadData();
</script>
</body>
</html>
