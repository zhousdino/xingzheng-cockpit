<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆管理 · 行政部驾驶舱</title>
<link rel="stylesheet" href="cockpit-style.css">
</head>
<body data-theme="dark">
<div class="wrap">
  <header class="top">
    <div>
      <h1>车辆管理</h1>
      <div class="sub">部门车辆台账与排期录入 · 表单化填报，无需直接改金山表格</div>
    </div>
    <div class="meta">
      数据更新时间：<b id="updTime">—</b><br>
      <a href="index.html" style="color:inherit;text-decoration:underline">← 返回驾驶舱</a>
    </div>
  </header>

  <!-- 风格切换（与主页一致） -->
  <div class="toolbar">
    <span class="lab">界面风格：</span>
    <button class="tbtn" data-set="dark">深色科技大屏</button>
    <button class="tbtn" data-set="business">浅色商务</button>
    <button class="tbtn" data-set="glass">毛玻璃渐变</button>
    <button class="tbtn" data-set="gov">政务简约</button>
    <button class="tbtn" data-set="warm">暖橙现代</button>
  </div>
  <div class="note">↑ 点上方按钮随时更换皮肤；你的选择会被记住。</div>

  <div class="databar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="t">填报说明</span>
      <span class="hint">填写并提交后，数据经自动任务写回金山《行政部驾驶舱模板》的「车辆信息」「车辆排期」sheet，驾驶舱自动刷新。</span>
    </div>
    <button id="btnAdd" style="border:1px solid var(--primary);background:var(--primary);color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">+ 新增车辆</button>
  </div>

  <!-- KPI -->
  <div class="kpis" id="kpis" style="grid-template-columns:repeat(6,1fr)"></div>

  <!-- 车辆列表 -->
  <div class="sec-title">车辆台账</div>
  <div class="sec-sub">以下为当前车辆信息（含保险 / 通行证临期·过期自动标红）。点击下方车辆卡片可编辑。</div>
  <div class="card">
    <div id="vehBoard"></div>
  </div>

  <!-- 新增/编辑 弹层 -->
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);max-width:720px;width:100%;padding:22px 24px;box-shadow:var(--shadow)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h2 id="modalTitle" style="font-size:17px;color:var(--primary-d);margin:0">新增车辆</h2>
        <button id="btnClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px">
        <label class="fld"><span>车牌 *</span><input id="f_plate" type="text" placeholder="如 新A·12345"></label>
        <label class="fld"><span>车型</span><input id="f_model" type="text" placeholder="如 别克 GL8"></label>
        <label class="fld"><span>驾驶员</span><input id="f_driver" type="text" placeholder="如 李娜"></label>
        <label class="fld"><span>状态</span>
          <select id="f_status">
            <option value="正常">正常</option>
            <option value="保养">保养</option>
            <option value="维修">维修</option>
          </select>
        </label>
        <label class="fld"><span>保险</span><input id="f_insurance" type="text" placeholder="如 人保 PICC-8821"></label>
        <label class="fld"><span>保险到期</span><input id="f_insExp" type="date"></label>
        <label class="fld"><span>通行证</span><input id="f_permit" type="text" placeholder="如 通-034"></label>
        <label class="fld"><span>通行证到期</span><input id="f_permitExp" type="date"></label>
        <label class="fld"><span>所有情况</span>
          <select id="f_ownership">
            <option value="自购">自购</option>
            <option value="租赁">租赁</option>
          </select>
        </label>
        <label class="fld"><span>当前位置</span><input id="f_curLoc" type="text" placeholder="可留空，默认取今日排期目的地"></label>
      </div>
      <label class="fld" style="margin-top:12px"><span>备注</span><input id="f_note" type="text" placeholder="如 主要用于接待"></label>

      <div style="margin-top:18px;display:flex;gap:10px;align-items:center">
        <button id="btnSave" style="border:1px solid var(--primary);background:var(--primary);color:#fff;padding:9px 22px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">提交</button>
        <button id="btnCancel" style="border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px">取消</button>
        <span id="formMsg" style="font-size:13px;color:var(--good);font-weight:600"></span>
      </div>
    </div>
  </div>

  <footer>行政部驾驶舱 · 车辆管理（表单录入版）· 与主页共用同一套风格与皮肤</footer>
</div>

<style>
/* 表单字段（沿用主页设计语言） */
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px}
.fld > span{color:var(--text-2);font-weight:600}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--text);background:var(--bg);min-width:0}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--primary)}
@media (max-width:600px){.fld{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)!important}}
</style>

<script>
/* ============ 风格切换（与主页共用 localStorage 键） ============ */
function applyTheme(t){
  document.body.dataset.theme=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.set===t));
  try{ localStorage.setItem('xz-cockpit-theme',t); }catch(e){}
}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>applyTheme(b.dataset.set));
let saved=null; try{ saved=localStorage.getItem('xz-cockpit-theme'); }catch(e){}
if(saved && ['dark','business','glass','gov','warm'].includes(saved)) applyTheme(saved); else applyTheme('dark');

/* ============ 工具（与主页一致） ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toDate(s){ if(!s) return null; const m=String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function vehExpClass(date){ if(!date) return ''; const today=todayStr(); if(date<today) return 'exp'; const d=toDate(date),t=toDate(today); if(d&&t){ const days=(d-t)/86400000; if(days>=0&&days<=30) return 'warn'; } return ''; }
function vehStatusClass(s){ return s==='保养'?'maint':(s==='维修'?'repair':'normal'); }

/* ============ 示例数据（无真实数据时演示） ============ */
const SAMPLE_VEHICLES=[
  {plate:'新A·12345', model:'别克 GL8', insurance:'人保 PICC-8821', insExp:'2026-09-30', driver:'李娜', permit:'通-034', permitExp:'2026-12-31', status:'正常', ownership:'自购', curLoc:'', locTime:'', note:'主要用于接待'},
  {plate:'新B·67890', model:'江铃全顺', insurance:'平安 PA-5543', insExp:'2026-08-10', driver:'王强', permit:'通-017', permitExp:'2026-10-15', status:'保养', ownership:'租赁', curLoc:'', locTime:'', note:'下周年检'},
  {plate:'新C·11223', model:'丰田陆地巡洋舰', insurance:'人寿财 LR-9012', insExp:'2027-03-20', driver:'赵磊', permit:'通-052', permitExp:'2026-07-31', status:'维修', ownership:'自购', curLoc:'', locTime:'', note:'空调检修中'}
];

/* ============ 数据加载（优先内嵌/桥接，回退示例） ============ */
let VEHICLE_DATA=[], VEHICLE_SCHED=[], DEMO=false;
async function loadData(){
  if(window.__COCKPIT_DATA__ && window.__COCKPIT_DATA__.vehicles && window.__COCKPIT_DATA__.vehicles.length){
    VEHICLE_DATA=window.__COCKPIT_DATA__.vehicles;
    VEHICLE_SCHED=window.__COCKPIT_DATA__.vehiclesched||[];
    document.getElementById('updTime').textContent='数据内嵌';
    render(); return;
  }
  try{
    const r=await fetch('/api/data'); if(r.ok){ const j=await r.json();
      if(j.vehicles && j.vehicles.length){ VEHICLE_DATA=j.vehicles; VEHICLE_SCHED=j.vehiclesched||[]; document.getElementById('updTime').textContent='本地桥接'; render(); return; }
    }
  }catch(e){}
  // 回退示例
  DEMO=true; VEHICLE_DATA=SAMPLE_VEHICLES; VEHICLE_SCHED=[];
  document.getElementById('updTime').textContent='示例数据';
  render();
}

/* ============ 渲染 ============ */
function vehCards(list,sched,today){
  return '<div class="vcards">'+list.map((v,i)=>{
    const sc=vehStatusClass(v.status);
    const insCls=vehExpClass(v.insExp), permCls=vehExpClass(v.permitExp);
    const insFlag=v.insExp?(v.insExp<today?'（已过期）':(insCls==='warn'?'（临期≤30天）':'')):'';
    const permFlag=v.permitExp?(v.permitExp<today?'（已过期）':(permCls==='warn'?'（临期≤30天）':'')):'';
    return `<div class="vcard" data-i="${i}" style="cursor:pointer">
      <div class="vhead"><span class="vplate">${v.plate}</span><span class="vstatus ${sc}">${v.status}</span><span class="vown">${v.ownership||'—'}</span></div>
      <div class="vinfo">
        <div class="it"><span class="k">车型</span><span class="vv">${v.model||'—'}</span></div>
        <div class="it"><span class="k">驾驶员</span><span class="vv">${v.driver||'—'}</span></div>
        <div class="it"><span class="k">保险</span><span class="vv ${insCls}">${v.insurance||'—'}${v.insExp?(v.insExp+insFlag):''}</span></div>
        <div class="it"><span class="k">通行证</span><span class="vv ${permCls}">${v.permit||'—'}${v.permitExp?(v.permitExp+permFlag):''}</span></div>
        <div class="it" style="grid-column:1/3"><span class="k">备注</span><span class="vv">${v.note||'—'}</span></div>
      </div>
    </div>`;
  }).join('')+'</div>';
}
function render(){
  const today=todayStr();
  const vk=document.getElementById('kpis');
  const total=VEHICLE_DATA.length;
  const normal=VEHICLE_DATA.filter(r=>r.status==='正常').length;
  const maint=VEHICLE_DATA.filter(r=>r.status==='保养').length;
  const repair=VEHICLE_DATA.filter(r=>r.status==='维修').length;
  const ownBuy=VEHICLE_DATA.filter(r=>r.ownership==='自购').length;
  const ownRent=VEHICLE_DATA.filter(r=>r.ownership==='租赁').length;
  vk.innerHTML=`
    <div class="kpi"><div class="strip"></div><div class="label">车辆总数</div><div class="num">${total}</div></div>
    <div class="kpi green"><div class="strip"></div><div class="label">正常</div><div class="num">${normal}</div></div>
    <div class="kpi warn"><div class="strip"></div><div class="label">保养</div><div class="num">${maint}</div></div>
    <div class="kpi red"><div class="strip"></div><div class="label">维修</div><div class="num">${repair}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">自购</div><div class="num">${ownBuy}</div></div>
    <div class="kpi"><div class="strip"></div><div class="label">租赁</div><div class="num">${ownRent}</div></div>`;
  const wrap=document.getElementById('vehBoard');
  if(DEMO){ wrap.innerHTML='<div class="empty">以下为<b>示例预览</b>。提交真实车辆后自动替换。</div>'+vehCards(VEHICLE_DATA,[],today); }
  else if(!total){ wrap.innerHTML='<div class="empty">暂无车辆信息。</div>'; }
  else { wrap.innerHTML=vehCards(VEHICLE_DATA,[],today); }
  // 点击卡片 → 编辑
  wrap.querySelectorAll('.vcard').forEach(c=>{
    c.onclick=()=>openModal(parseInt(c.dataset.i));
  });
}

/* ============ 表单（新增 / 编辑） ============ */
const modal=document.getElementById('modal');
let editIdx=-1;
function openModal(i){
  editIdx=i;
  document.getElementById('modalTitle').textContent = i>=0 ? '编辑车辆' : '新增车辆';
  const v = i>=0 ? VEHICLE_DATA[i] : {};
  document.getElementById('f_plate').value=v.plate||'';
  document.getElementById('f_model').value=v.model||'';
  document.getElementById('f_driver').value=v.driver||'';
  document.getElementById('f_status').value=v.status||'正常';
  document.getElementById('f_insurance').value=v.insurance||'';
  document.getElementById('f_insExp').value=v.insExp||'';
  document.getElementById('f_permit').value=v.permit||'';
  document.getElementById('f_permitExp').value=v.permitExp||'';
  document.getElementById('f_ownership').value=v.ownership||'自购';
  document.getElementById('f_curLoc').value=v.curLoc||'';
  document.getElementById('f_note').value=v.note||'';
  document.getElementById('formMsg').textContent='';
  modal.style.display='flex';
}
function closeModal(){ modal.style.display='none'; editIdx=-1; }
document.getElementById('btnAdd').onclick=()=>openModal(-1);
document.getElementById('btnClose').onclick=closeModal;
document.getElementById('btnCancel').onclick=closeModal;
modal.onclick=(e)=>{ if(e.target===modal) closeModal(); };

/* 组装成与 bridge/parse.js 的 mapVehicleHeader 对齐的带表头 TSV */
function buildTSV(rec){
  const head=['车牌','车型','保险','保险到期','驾驶员','通行证','通行证到期','状态','所有情况','当前位置','上报时间','备注'];
  const row=[rec.plate,rec.model,rec.insurance,rec.insExp,rec.driver,rec.permit,rec.permitExp,rec.status,rec.ownership,rec.curLoc,rec.locTime,rec.note];
  return head.join('\t')+'\n'+row.map(c=>(c||'').replace(/\t/g,' ')).join('\t');
}
document.getElementById('btnSave').onclick=async ()=>{
  const rec={
    plate:document.getElementById('f_plate').value.trim(),
    model:document.getElementById('f_model').value.trim(),
    insurance:document.getElementById('f_insurance').value.trim(),
    insExp:document.getElementById('f_insExp').value.trim(),
    driver:document.getElementById('f_driver').value.trim(),
    permit:document.getElementById('f_permit').value.trim(),
    permitExp:document.getElementById('f_permitExp').value.trim(),
    status:document.getElementById('f_status').value,
    ownership:document.getElementById('f_ownership').value,
    curLoc:document.getElementById('f_curLoc').value.trim(),
    locTime:'',
    note:document.getElementById('f_note').value.trim()
  };
  const msg=document.getElementById('formMsg');
  if(!rec.plate){ msg.style.color='var(--alert)'; msg.textContent='车牌为必填项'; return; }
  const text=buildTSV(rec);
  msg.style.color='var(--text-2)'; msg.textContent='提交中…';
  try{
    const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'vehicles',text})});
    const j=await r.json();
    if(j.ok){ msg.style.color='var(--good)'; msg.textContent='✓ 已提交，自动同步到驾驶舱'; closeModal(); loadData(); }
    else { msg.style.color='var(--alert)'; msg.textContent='提交失败：'+(j.error||'未知'); }
  }catch(e){
    msg.style.color='var(--alert)'; msg.textContent='提交失败：未连接本地桥接服务（公开链接填报将在下一步接通）。';
  }
};

loadData();
</script>
</body>
</html>
